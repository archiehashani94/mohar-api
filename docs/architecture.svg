<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 860" font-family="Inter, system-ui, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#8b93a7"/></marker>
    <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#2ee6a8"/></marker>
    <style>
      .t{fill:#e9ebf2;font-size:15px;font-weight:700}
      .s{fill:#8b93a7;font-size:12px}
      .z{fill:#0f1118;stroke:#232838;stroke-width:1.5}
      .pv{fill:#171330;stroke:#7c5cff;stroke-width:1.5}
      .pb{fill:#0d1d18;stroke:#2ee6a8;stroke-width:1.5}
      .l{stroke:#8b93a7;stroke-width:1.6;fill:none}
      .lm{stroke:#2ee6a8;stroke-width:1.8;fill:none}
      .cap{fill:#8b93a7;font-size:11.5px}
      .h{font-size:13px;font-weight:800;letter-spacing:.12em}
    </style>
  </defs>
  <rect width="1400" height="860" fill="#07080c"/>
  <text x="40" y="48" fill="#fff" font-size="26" font-weight="800">Kavach — architecture &amp; privacy threat model</text>
  <text x="40" y="74" class="s" font-size="14">Purple = private (never leaves its owner unencrypted) · Green = public (on-chain, readable by insurer and the world) · Grey = infrastructure that only sees ciphertext</text>

  <!-- PRIVATE ZONE -->
  <rect x="30" y="100" width="560" height="560" rx="18" fill="none" stroke="#7c5cff" stroke-dasharray="7 6" stroke-width="1.5"/>
  <text x="50" y="128" class="h" fill="#7c5cff">OFF-CHAIN · PRIVATE</text>

  <rect class="pv" x="55" y="150" width="240" height="150" rx="14"/>
  <text class="t" x="75" y="180">🗝 Patient · Vault</text>
  <text class="s" x="75" y="204">secp256k1 key (wallet + consent)</text>
  <text class="s" x="75" y="222">policy copy (terms + salt)</text>
  <text class="s" x="75" y="240">record keys (AES-256)</text>
  <text class="s" x="75" y="258">re-derives payout + nullifier</text>
  <text class="s" x="75" y="276">before signing consent</text>

  <rect class="pv" x="325" y="150" width="240" height="210" rx="14"/>
  <text class="t" x="345" y="180">🏥 Hospital · Seal</text>
  <text class="s" x="345" y="204">hospital secret (registry leaf)</text>
  <text class="s" x="345" y="222">diagnosis ICD-10 · procedure</text>
  <text class="s" x="345" y="240">itemised bill · FHIR record</text>
  <text class="s" x="345" y="258">patient consent signature</text>
  <rect x="345" y="276" width="200" height="66" rx="10" fill="#7c5cff" opacity=".22"/>
  <text x="358" y="300" fill="#fff" font-size="13.5" font-weight="700">Noir circuit · bb.js</text>
  <text x="358" y="320" class="s">UltraHonk proof in browser</text>
  <text x="358" y="336" class="s">45.6k gates · ~2–8 s</text>

  <rect class="pv" x="55" y="330" width="240" height="110" rx="14"/>
  <text class="t" x="75" y="360">🩺 Doctor / 🚑 Responder</text>
  <text class="s" x="75" y="384">ECIES-wrapped record key</text>
  <text class="s" x="75" y="402">2 of 3 Shamir shares (break-glass)</text>
  <text class="s" x="75" y="420">decrypts only while grant is live</text>

  <rect class="pv" x="55" y="470" width="240" height="90" rx="14"/>
  <text class="t" x="75" y="500">👁 Insurer back-office</text>
  <text class="s" x="75" y="524">knows its policies (it wrote them)</text>
  <text class="s" x="75" y="542">never sees diagnosis / hospital</text>

  <rect class="z" x="325" y="400" width="240" height="160" rx="14"/>
  <text class="t" x="345" y="430">☁ Kavach API</text>
  <text class="s" x="345" y="454">IPFS pin node (CIDv1 ciphertext)</text>
  <text class="s" x="345" y="472">consent inbox (ECIES-sealed)</text>
  <text class="s" x="345" y="490">relayer (submits for hospital)</text>
  <text class="s" x="345" y="508">Ghost Pay bridge (Zcash rail)</text>
  <text class="cap" x="345" y="536">sees: ciphertext, CIDs, public inputs</text>

  <rect class="z" x="55" y="590" width="510" height="54" rx="12"/>
  <text x="75" y="622" fill="#e9ebf2" font-size="14" font-weight="700">📦 IPFS</text>
  <text x="140" y="622" class="s">FHIR R4 · AES-256-GCM ciphertext only · CID + hash on-chain</text>

  <!-- PUBLIC ZONE -->
  <rect x="660" y="100" width="710" height="560" rx="18" fill="none" stroke="#2ee6a8" stroke-dasharray="7 6" stroke-width="1.5"/>
  <text x="680" y="128" class="h" fill="#2ee6a8">ON-CHAIN · PUBLIC (EVM: Anvil / Base Sepolia)</text>

  <rect class="pb" x="690" y="150" width="320" height="250" rx="14"/>
  <text class="t" x="710" y="180">⛓ ClaimSettlement</text>
  <text class="s" x="710" y="204">verifies proof (HonkVerifier, 17.7 KB)</text>
  <text class="s" x="710" y="222">nullifier set · used-per-policy</text>
  <text class="s" x="710" y="240">claim date window · insurer pool</text>
  <text class="s" x="710" y="258">pays payout_recipient in bINR</text>
  <text x="710" y="290" fill="#2ee6a8" font-size="12.5" font-weight="700">7 public inputs:</text>
  <text class="s" x="710" y="310">hospital_root · policy_commitment</text>
  <text class="s" x="710" y="328">nullifier · claim_date · used_before</text>
  <text class="s" x="710" y="346">payout_amount · payout_recipient</text>
  <text class="cap" x="710" y="378">≈2.8M gas / claim · relayer-submitted</text>

  <rect class="pb" x="1030" y="150" width="310" height="120" rx="14"/>
  <text class="t" x="1050" y="180">⚖ Regulator</text>
  <text class="s" x="1050" y="204">hospital leaves + HFR ids (public list)</text>
  <text class="s" x="1050" y="222">Merkle root · root history</text>
  <text class="s" x="1050" y="240">revocation kills old roots · pause</text>

  <rect class="pb" x="1030" y="290" width="310" height="110" rx="14"/>
  <text class="t" x="1050" y="320">🗂 HealthVault</text>
  <text class="s" x="1050" y="344">record hash + CID · timed role grants</text>
  <text class="s" x="1050" y="362">wrapped keys · AccessLogged audit</text>
  <text class="s" x="1050" y="380">re-key on revoke · grants from patient</text>

  <rect class="pb" x="1030" y="420" width="310" height="100" rx="14"/>
  <text class="t" x="1050" y="450">🚑 BreakGlass</text>
  <text class="s" x="1050" y="474">guardians · requests · approvals</text>
  <text class="s" x="1050" y="492">24h window · EmergencyViewed log</text>

  <rect class="pb" x="690" y="420" width="320" height="100" rx="14"/>
  <text class="t" x="710" y="450">👻 Ghost Pay</text>
  <text class="s" x="710" y="474">one-time address = keccak(secret, nullifier)</text>
  <text class="s" x="710" y="492">or bridge → Zcash shielded pool</text>

  <rect x="690" y="545" width="650" height="95" rx="14" fill="#1a0f14" stroke="#ff5470" stroke-width="1.5"/>
  <text x="710" y="574" fill="#ff5470" font-size="14" font-weight="800">NEVER ON-CHAIN</text>
  <text class="s" x="710" y="598">diagnosis · procedure · prescriptions · bill lines · policy terms · which hospital · patient identity in claims</text>
  <text class="s" x="710" y="618">hospital wallet · payout owner · record contents — verified by sdk/scripts/leak-test.ts (16 checks, 0 hits)</text>

  <!-- arrows -->
  <path class="l" d="M295 215 H323" marker-end="url(#a)"/>
  <text class="cap" x="297" y="236">sig</text>
  <path class="lm" d="M565 309 C 620 309 620 260 688 260" marker-end="url(#am)"/>
  <text x="590" y="250" fill="#2ee6a8" font-size="11.5">proof + 7 inputs</text>
  <text x="590" y="266" fill="#2ee6a8" font-size="11.5">via relayer</text>
  <path class="l" d="M445 360 V398" marker-end="url(#a)"/>
  <path class="l" d="M445 560 V588" marker-end="url(#a)"/>
  <text class="cap" x="760" y="420"> </text>
  <path class="l" d="M1185 270 V288"/>
  <path class="lm" d="M850 400 V418" marker-end="url(#am)"/>
  <path class="l" d="M1028 210 H1012" marker-end="url(#a)"/>

  <!-- legend / threats -->
  <text x="40" y="700" fill="#fff" font-size="16" font-weight="800">Threats → mitigations</text>
  <g font-size="12.5" fill="#c9cede">
    <text x="40" y="728">• Insurer learns diagnosis → ZK proof; only 7 public inputs</text>
    <text x="40" y="750">• Payment reveals specialty hospital → Ghost Pay one-time / shielded recipient</text>
    <text x="40" y="772">• Tx sender reveals hospital → relayer submits</text>
    <text x="40" y="794">• Fake / revoked hospital → Merkle membership + revocation kills old roots</text>
    <text x="40" y="816">• Duplicate claim → nullifier H(salt, record, procedure)</text>
    <text x="700" y="728">• Claim splitting → contract-fed used_before, in-circuit limit</text>
    <text x="700" y="750">• Phantom patient → patient secp256k1 consent verified in-circuit</text>
    <text x="700" y="772">• Front-running / tampering → recipient + amount bound in proof</text>
    <text x="700" y="794">• Revoked doctor keeps key → re-encrypt + version-bound grants</text>
    <text x="700" y="816">• Break-glass abuse → 2-of-3 Shamir + 24h window + loud on-chain log</text>
  </g>
</svg>
